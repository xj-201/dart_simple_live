name: Build Simple Live Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.0"
      VERSION_CODE: "1"
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'

      - name: Restore Signing Key and Properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > simple_live_app/android/upload.jks
          cat <<EOF > simple_live_app/android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload.jks
          EOF

      # 👇 修改：彻底清除遗留的注册文件与 Pub 缓存并重新生成 👇
      - name: Clean and Force Regenerate Plugin Registrant
        run: |
          cd simple_live_app
          flutter clean
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
